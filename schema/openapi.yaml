        **Note:** This operation is NOT intended for listing resources in bulk. Performance can degrade significantly as `offset` increases. Consider alternatives if you frequently need an `offset` of more than 1000.
      operationId: getFolderChildren
      parameters:
        - name: offset
          in: query
          description: |
            The number of children to skip.

            Use this parameter with the ``limit`` query parameter to split the response into multiple pages. To fetch the first page, specify ``offset`` =0 (do not skip any children). To fetch the second page, specify ``offset`` = value of ``limit`` you specified for the first page. So, the server skips the children returned on the first page. In general, ``offset`` = ``previous_offset`` + ``previous_limit``.

            This parameter is 0 by default. The minimum value is 0 and the maximum value 2147483648.
          required: false

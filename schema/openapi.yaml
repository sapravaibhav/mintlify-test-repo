            Must contain the ``etag`` value of the Folder object you wish to update. If the specified value does not match the ``etag`` of the Folder, the system returns a `precondition error <https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1>`_ (HTTP status code ``412`` ). This check ensures that simultaneous PUT requests do not overwrite each other.
          schema:
            type: string
        - $ref: '#/components/parameters/externalId4folders'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderUpdateRequest'
            examples:
              NodeUpdateRequest:
                $ref: '#/components/examples/RequestBodyCreateFolder'
        required: true
      responses:
        '202':
          description: 'The request succeeded. The server issued a command, which started an asynchronous process to update the folder.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                OnSuccess:
                  $ref: '#/components/examples/DefaultCommandResponseSucceeds'
        '400':

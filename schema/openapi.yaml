              description: ContentItemBatchGetOnExternalId
              value:
                - someExternalId
                - anotherExternalId
        - name: ids
          in: query
          description: |
            The IDs of the content items to retrieve. Multiple IDs must be specified as a comma-separated string without spaces.

            **Note:** If you specify  ``ids``, do not specify anything for the ``externalIds`` query parameter.
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              maxLength: 36
              minLength: 36
            minItems: 1
            maxItems: 20
          examples:
            ContentItemBatchGetOnId:

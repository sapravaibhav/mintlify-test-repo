        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - 2-legged:
            - 'data:create'
        - 3-legged:
            - 'data:create'
  '/collections/{collectionId}/libraries/{sourceLibraryId}/clone:shallow':
    parameters:
      - $ref: '#/components/parameters/collectionIdEnhanced'
      - name: sourceLibraryId
        in: path
        description: The ID of the library to clone.
        required: true

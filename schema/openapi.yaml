            Use this parameter with the ``offset`` query parameter to split the response into multiple pages. To fetch the first page, specify ``offset`` =0 (do not skip any child nodes). To fetch the second page, specify ``offset`` = value of ``limit`` you specified for the first page. So, the server skips the child nodes returned on the first page. In general, ``offset`` = ``previous_offset`` + ``previous_limit``.

            This parameter is 20 by default. The minimum value is 10 and the maximum value 20.'
          required: false

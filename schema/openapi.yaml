  '/collections/{collectionId}/libraries/{libraryId}/assignments':
    parameters:
      - $ref: '#/components/parameters/collectionIdEnhanced'
      - name: libraryId
        in: path
        description: The ID of the library you are assigning or removing content items from.
        required: true
        schema:
          type: string
        example: 22d17b7c-dc27-4898-bbe3-c6ac6dbe535a
    post:
      tags:
        - Libraries
      summary: Change Library Assignments
      description: |-
        Assigns content items to the specified content library or removes assigned content items from the library.

        **Note:** This operation is possible only if the collection the libraries belong to is a shared collection with logical mappings. See `Developer's Guide </en/docs/content/v2/developers_guide/basics/collections/#collections-with-enhanced-search-capabilities>`_ for more information.

        Assigning a content item to a library is the process by which a content item that belongs to one library is shared with another.  The content item continues to belong to the original content library it was created under. However, the content item becomes visible  and accessible in the content library it was assigned to.

        To `delete </en/docs/content/v2/reference/http/content-deletecontentbyid-DELETE/>`_ or `update </en/docs/content/v2/reference/http/content-updatecontentitem-PUT/>`_ a content item, you must access it through the content library that owns it. If you delete a content item, it is deleted from all libraries. However, if you use the Change Library Assignments operation (this operation) to remove a content item, it is removed only from the specified content library.

        The server verifies whether the calling user or service has the necessary permissions to add or remove content items from the specified library. If authorized, the server initiates a command that triggers an asynchronous process to update the library.
      operationId: changeLibraryAssignments
      parameters:
        - name: sourceLibraryId
          in: query
          required: false
          schema:
            type: string
          description: |
            The ID of the original content library that the content item was created in.  This parameter is required if the ``add`` array in the request body is specified.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryAssignmentRequest'
            examples:
              LibraryAssignmentRequest:

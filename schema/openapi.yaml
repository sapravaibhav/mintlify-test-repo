  parameters:
    externalId4category:
      name: externalId
      in: query
      required: false
      schema:
        type: boolean
      description: |
        ``true``: Indicates that the ``categoryId`` URI parameter contains the External ID of the Category object.

        ``false``: (Default) Indicates that the ``categoryId`` URI parameter contains the ID of the Category.
    externalId4tags:
      name: externalId
      in: query
      required: false
      schema:
        type: boolean
      description: |
        ``true``: Indicates that the ``tagId`` URI parameter contains the External ID of the Tag object.

        ``false``: (Default) Indicates that the ``tagId`` URI parameter contains the ID of the Tag.
    externalId4folders:
      name: externalId
      in: query
      required: false
      schema:
        type: boolean
      description: |
        ``true``: Indicates that the ``folderId`` URI parameter contains the External ID of the Folder object.

        ``false``: (Default) Indicates that the ``folderId`` URI parameter contains the ID of the Folder.
    externalId4contentitems:
      name: externalId
      in: query
      required: false
      schema:
        type: boolean
      description: |
        ``true``: Indicates that the ``contentItemId`` URI parameter contains the External ID of the content item.

        ``false``: (Default) Indicates that the ``contentItemId`` URI parameter contains the ID of the content item.
    version4contentitems:
      name: version
      in: query
      required: false
      schema:
        type: string
      description: The Internal Version of the content item to retrieve.
      x-ignore: true
    exVersion4contentitems:
      name: exVersion
      in: query
      required: false
      schema:
        type: string
      description: A user-defined ID that is used to identify a specific version of a content item. If not specified, this operation will retrieve the latest version of the content item. Can be specified only when ``externalId`` is ``true``.
    externalId4node:
      name: externalId
      in: query
      required: false
      schema:
        type: boolean
      description: |
        ``true``: Indicates that the ``nodeId`` URI parameter contains the External ID of the node.

        ``false``: (Default) Indicates that the ``nodeId`` URI parameter contains the ID of the node.
    includeFields:
      name: includeFields
      in: query
      description: |
        Specifies what attributes the response must contain. If you don't specify this parameter the response returns all attributes.

        Use the dot notation to specify nested attributes. Specify multiple attributes as comma-separated values.

        **Note:** Currently, only the attributes directly under the ``components`` attribute (for example: ``components.info``, ``components.parent``) can be specified for ``includeFields``.
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        minItems: 1
      examples:
        IncludeSingleField:
          description: IncludeSingleField
          value:
            - components.info
        IncludeMultipleFields:
          description: IncludeMultipleFields
          value:
            - 'components.info,components.parent'
    filterAttributes:
      name: filterAttributes
      in: query
      description: |
        Filters the results by the value of an attribute added to the ``attributes`` object of a content item. 
        
        The syntax is ``?filterAttributes[myCustomAttribute]=foo bar``, where ``myCustomAttribute`` is an attribute added to the ``attributes`` object, and ``foo bar`` is the value to match.  Only exact matches are returned.
        
        You can specify this parameter many times in the same request. For example: 
        
        - ``?filterAttributes[exVersion]=1.0&filterAttributes[exVersion]=2.0`` returns all content items where ``attributes.exVersion`` is ``1.0`` OR ``2.0``.

          **Tip** This can be shortened as follows:

          ``?filterAttributes[exVersion]=1.0,2.0``
        - ``?filterAttributes[myFirstCustomAttribute]=foo&filterAttributes[mySecondCustomAttribute]=bar`` returns all content items where ``attributes.myFirstCustomAttribute=foo`` AND ``attributes.mySecondCustomAttribute=bar``.
      required: false
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      examples:
        FilterSingleKey:
          description: FilterSingleKey
          value:
            - filterAttributes[foo]=bar
    collectionId4Library:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
      description: The ID of the collection that contains the library specified by the ``libraryId`` URI parameter.
      example: 71f86f13-867b-4e7d-83a4-75da598e78b4
    collectionIdEnhanced:
      name: collectionId

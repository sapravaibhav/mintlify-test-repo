openapi: 3.0.1
info:
  title: OAS Example Project V1
  description: OAS Example Project V1 (OEP V1) is a cloud content service for creating and managing libraries. The Content API allows users to create libraries and assign permissions to focus the library on specific groups of people projects or organizations to publish and access the content.
  termsOfService: 'https://www.autodesk.com/company/legal-notices-trademarks/terms-of-service-autodesk360-web-services/forge-platform-web-services-api-terms-of-service'
  x-external: true
  x-use-rst-examples: true
  x-forge-service-name: schema
  contact:
    name: Vibranium Squad
    url: 'https://autodesk.slack.com/messages/forge-content/'
    email: forge-vibranium-squad@autodesk.com
  license:
    name: Autodesk Proprietary License
    url: 'https://www.autodesk.com/company/legal-notices-trademarks'
  version: 1.0.0
servers:
  - url: 'https://developer-dev.api.autodesk.com/content/v2'
    description: The URL for Development environment.
    variables: {}
  - url: 'https://developer-stg.api.autodesk.com/content/v2'
    description: The URL for Staging environment.
    variables: {}
  - url: 'https://developer.api.autodesk.com/content/v2'
    description: The URL for Production environment.
    variables: {}
tags:
  - name: Libraries
  - name: Binaries
  - name: Content Items
  - name: Search
  - name: Nodes
  - name: Categories
  - name: Tags
  - name: Folders
  - name: Paths
  - name: Hierarchy
  - name: Collections
  - name: Commands
paths:
  '/commands/{commandId}':
    parameters:
      - name: commandId
        in: path
        description: Fetch command details
        required: true
        schema:
          type: string
        example: bGlicmFyaWVzOjQzZjQ2ZTdhLTc4MDMtNDI3YS1iYzM1LTY3MWQ0OWYyNDViYg
    get:
      tags:
        - Commands
      summary: Check Collection Creation Status
      description: |-
        Returns information about the collection creating command specified by the ``commandId`` URI parameter. This information includes the status of the process the command started and ID of the collection that was created.

        You can't use this operation to check the status of a command that creates anything other than a collection. Use `Check Command Status`_  to check the status of such commands.

        .. include:: /content/_snippets/v2/endpoint_hyperlinks.rst
      operationId: getCommandById
      responses:
        '200':
          description: The request succeeded. Information about the command is returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionCommandResponse'
              examples:
                CommandResponse:
                  $ref: '#/components/examples/CommandResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
      parameters: []
  '/collections/{collectionId}/commands/{commandId}':
    parameters:
      - name: collectionId
        in: path
        description: The ID of the collection containing the library the command was issued for.
        required: true
        schema:
          type: string
        example: 71f86f13-867b-4e7d-83a4-75da598e78b4
      - name: commandId
        in: path
        description: The ID of the command you are checking.
        required: true
        schema:
          type: string
        example: bGlicmFyaWVzOjQzZjQ2ZTdhLTc4MDMtNDI3YS1iYzM1LTY3MWQ0OWYyNDViYg
    get:
      tags:
        - Commands
      summary: Check Command Status
      description: |-
        Returns information about the command specified by the ``commandId`` URI parameter. This information includes the status of the asynchronous process the command started and details of any resources that were created.

        You can't use this operation to check the status of a command that creates a collection. Use `Check Collection Creation Status`_  to check the status of a command that creates a collection.

        .. include:: /content/_snippets/v2/endpoint_hyperlinks.rst
      operationId: getCommandByIdWithCollection
      responses:
        '200':
          description: The request succeeded. Information about the command is returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
              examples:
                CommandResponse:
                  $ref: '#/components/examples/CommandResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
  '/collections/{collectionId}/libraries/{libraryId}/content-items/{contentItemId}':
    parameters:
      - schema:
          type: string
        name: collectionId
        in: path
        required: true
        description: The ID of the collection containing the content item specified by the ``contentItemId`` URI parameter.
        example: 71f86f13-867b-4e7d-83a4-75da598e78b4
      - name: libraryId
        in: path
        description: The ID of the library containing the content item specified by the ``contentItemId`` URI parameter.
        required: true
        schema:
          type: string
        example: 927cb8dc-61bb-4879-a3e8-870319b64800
    get:
      tags:
        - Content Items
      summary: Retrieve a Content Item
      description: |
        Returns the content item specified by the ``contentItemId`` URI parameter.

        If there are many versions of the specified content item, and you do not specify a specific version, this operation returns the latest version.

        **Note:** The server returns the content item only if the calling user or service has permission to read content items in the library the content item belongs to.
      operationId: getContentItemById
      parameters:
        - schema:
            type: string
          in: path
          required: true
          name: contentItemId
          description: The ID of the content item to retrieve.
        - $ref: '#/components/parameters/externalId4contentitems'
        - $ref: '#/components/parameters/version4contentitems'
        - $ref: '#/components/parameters/exVersion4contentitems'
      responses:
        '200':
          description: Request was successful. Details of the requested content item are returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
              examples:
                ContentItemResponse:
                  $ref: '#/components/examples/ContentItemResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Content ID:
                  value:
                    type: CNT-001
                    title: Not Found
                    detail: Invalid contentItemId 13c07ddd-252d-41ab-829b-a43409d8bfda not found under given library.
                    requestId: c9e734bac6e895dd298bf66b57982408
                    timestamp: 1600928605987
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
    put:
      tags:
        - Content Items
      summary: Update a Content Item
      description: |-
        Modifies the details of the specified content item. The value of the ``etag`` attribute changes to indicate that the content item was modified.

        The server verifies whether the calling user or service has the necessary permissions to update content items in the library. If authorized, the server initiates a command that triggers an asynchronous process to update the library.

        If there are multiple versions of the content item and no version is specified, the latest version will be updated. If it is assigned to (shared with) other content libraries, the updates impact those libraries as well.

      operationId: updateContentItem
      parameters:
        - schema:
            type: string
          in: path
          required: true
          description: The ID of the content item to update.
          name: contentItemId
        - schema:
            type: string
          in: header
          name: If-Match
          description: |
            Enables `optimistic locking behavior <https://en.wikipedia.org/wiki/Optimistic_concurrency_control>`_, when specified.

            Must contain the ``etag`` value of the content item you are updating. If the specified value does not match the ``etag`` of the content item, the system returns a `precondition error <https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1>`_ (HTTP status code ``412`` ). This check ensures that simultaneous PUT requests do not overwrite each other.
        - $ref: '#/components/parameters/externalId4contentitems'
        - $ref: '#/components/parameters/version4contentitems'
        - $ref: '#/components/parameters/exVersion4contentitems'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemUpdateRequest'
        required: true
      responses:
        '202':
          description: 'The request succeeded. The server issued a command, which started an asynchronous process to update the specified content item.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                OnSuccess:
                  $ref: '#/components/examples/DefaultCommandResponseSucceeds'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '412':
          $ref: '#/components/responses/412'
      security:
        - 2-legged:
            - 'data:write'
        - 3-legged:
            - 'data:write'
    delete:
      tags:
        - Content Items
      summary: Delete a Content item
      description: |-
        Permanently deletes the specified content item.

        If there are multiple versions of the content item and no version is specified, the latest version will be deleted. If it is assigned to (shared with) other content libraries, it is deleted from those libraries as well.

        The server verifies whether the calling user or service has the necessary permissions to delete content items from the library. If authorized, the server initiates a command that triggers an asynchronous process to delete the content item.
      operationId: deleteContentById
      parameters:
        - schema:
            type: string
          in: path
          required: true
          description: The ID of the content item to delete.
          name: contentItemId
        - $ref: '#/components/parameters/externalId4contentitems'
        - $ref: '#/components/parameters/version4contentitems'
        - $ref: '#/components/parameters/exVersion4contentitems'
      responses:
        '202':
          description: 'The request succeeded. The server issued a command, which started an asynchronous process to delete the specified content item.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                OnSuccess:
                  $ref: '#/components/examples/DefaultCommandResponseSucceeds'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      security:
        - 2-legged:
            - 'data:write'
        - 3-legged:
            - 'data:write'
  '/collections/{collectionId}/libraries/{libraryId}/content-items':
    parameters:
      - name: collectionId
        in: path
        description: The ID of the collection that contains the content library you are adding the content item to.
        required: true
        schema:
          type: string
        example: 71f86f13-867b-4e7d-83a4-75da598e78b4
      - name: libraryId
        in: path
        description: The ID of the library that contains the content.
        required: true
        schema:
          type: string
        example: d54a7efd-7ed4-4cd3-8855-21fb332000c7
    post:
      tags:
        - Content Items
      summary: Create a Content Item
      description: |-
        Creates a content item under the specified library.

        The server verifies whether the calling user or service has the necessary permissions to create content items in the library. If authorized, the server initiates a command that triggers an asynchronous process to create the content item.
      operationId: createContentItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemCreateRequest'
            examples:
              CreateContentItemRequest:
                $ref: '#/components/examples/RequestBodyContentItem'
              CreateContentItemWithCategoriesRequest:
                $ref: '#/components/examples/RequestBodyContentItemWithCategories'
        required: true
      responses:
        '202':
          description: 'The request succeeded. The server issued a command, which started an asynchronous process to create a content item.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                OnSuccess:
                  $ref: '#/components/examples/DefaultCommandResponseSucceeds'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - 2-legged:
            - 'data:create'
        - 3-legged:
            - 'data:create'
  '/collections/{collectionId}/content-items:search':
    parameters:
      - name: collectionId
        in: path
        description: The ID of the collection containing the library you want to search.
        required: true
        schema:
          type: string
        example: 71f86f13-867b-4e7d-83a4-75da598e78b4
    get:
      tags:
        - Search
      summary: Search for Content Items (GET Method)
      description: |-
        Performs a search on the specified content library and returns a list of content items that satisfy the search criteria. You specify the search criteria using the ``filter`` and ``query`` query string parameters.

        If the maximum number of characters allowed on a URL (255 characters) inhibits the ability to specify the search criterea you require, use the `POST Search for Content Items </en/docs/content/v2/reference/http/content-searchcontentitemspost-POST/>`_ operation.

        **Note:** Unlike with this operation (GET Search for Content Items), the response to the `POST Search for Content Items </en/docs/content/v2/reference/http/content-searchcontentitemspost-POST/>`_ operation is not cacheable.
      operationId: searchContentItemsNew
      parameters:
        - name: filter
          in: query
          description: |-
            A filter expression to limit the scope of the search to content items that exactly match the specified criteria. This parameter is empty by default, which means that the scope of the search is all content items.  Specifying filters result in faster searches.

            The maximum length of a filter expression is 255 characters.  For an illustration of the syntax to use, see Examples 2 and 3.

            =================================================	===============================================================	======================================================================================================================================
            To filter by:                                    	Specify filter as:                                             	Result:                                                                                                                               
            =================================================	===============================================================	======================================================================================================================================
            ``attributes.etag``                              	``?filter=attributes.etag:<VALUE-TO-MATCH>``                   	Content item where ``attributes.etag`` is ``<VALUE-TO-MATCH>``                                                                        
            ``categories.externalId``                        	``?filter=categoriesIdAll:<CATEGORY-TO-MATCH>``                	All content items where ``categories.externalId``  is ``<CATEGORY-TO-MATCH>`` or one of its descendants.                              
            ``categories.externalId``                        	``?filter=categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	All content items where ``categories.externalId``  is ``<CATEGORY-TO-MATCH>``.                                                        
            ``categories.id``                                	``?filter=categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	All content items where ``categories.id``  is ``<CATEGORY-TO-MATCH>``.                                                                
            ``components.status.value``                      	``?filter=status:<VALUE-TO-MATCH>``                            	All content items where ``components.status.value``  is ``<VALUE-TO-MATCH>``                                                          
            ``components.tag.values``                        	``?filter=tag.values:<VALUE-TO-MATCH>``                        	All content items where ``components.tag.value``  is ``<VALUE-TO-MATCH>``. See examples 2 and 3 for an illustration.                  
            ``createdBy.date``                               	``?filter=createTime>=<TIME-STAMP-TO-MATCH>``                  	All content items where ``createdBy.date`` is greater than or equal to ``<TIME-STAMP-TO-MATCH>``.                                     
            ``createdBy.serviceId``                          	``?filter=createdBy:<VALUE-TO-MATCH>``                         	All content items where ``createdBy.serviceId```  is ``<VALUE-TO-MATCH>``. See example 3 for an illustration.                         
            ``id``                                           	``?filter=id:<VALUE-TO-MATCH>``                                	Content item where ``id`` is ``<VALUE-TO-MATCH>``                                                                                     
            ``modifiedBy.date``                              	``?filter=lastModifiedTime>=<TIME-STAMP-TO-MATCH>``            	All content items where ``modifiedBy.date`` is greater than or equal to ``<TIME-STAMP-TO-MATCH>``.                                    
            ``modifiedBy.serviceId``                         	``?filter=lastModifiedBy:<VALUE-TO-MATCH>``                    	All content items where ``modifiedBy.serviceId`` is ``<VALUE-TO-MATCH>``.                                                             
            ``type``                                         	``?filter=type.fullname:<VALUE-TO-MATCH>``                     	All content items where ``type`` is ``<VALUE-TO-MATCH>``                                                                              
            Custom attributes under the ``attributes`` object	``?filter=attributes.<CUSTOM-ATTRIBUTE>:<VALUE-TO-MATCH>``     	All content items where ``attributes.<CUSTOM-ATTRIBUTE>`` is ``<VALUE-TO-MATCH>``                                                     
            Custom attributes under the ``components`` object	``?filter=<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>:<VALUE-TO-MATCH>``	All content items where ``components.<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>``  is ``<VALUE-TO-MATCH>``. See example 3 for an illustration.
            =================================================	===============================================================	======================================================================================================================================


            You can also filter by the constituent parts of the ``type`` attribute. If the value of ``type`` is expressed as ``<TYPE_NAME>-<SEMANTIC_VERSION>``, and ``<SEMANTIC_VERSION>`` is expressed as ``<MAJOR_VERSION>.<MINOR_VERSION>.<PATCH_VERSION>-<BUILD_METADATA>``:

            =================================================	===============================================================	======================================================================================================================================
            To filter by:                                    	Specify filter as:                                             	Result:                                                                                                                               
            =================================================	===============================================================	======================================================================================================================================
            ``<TYPE_NAME>-<SEMANTIC_VERSION>``               	``?filter=type.fullname:<VALUE-TO-MATCH>``                     	All content items where ``type`` is ``<VALUE-TO-MATCH>``                                                                              
            ``<TYPE_NAME>``                                  	``?filter=type.name:<VALUE-TO-MATCH>``                         	All content items where the type name component of ``type`` is ``<VALUE-TO-MATCH>``                                                   
            ``<SEMANTIC_VERSION>``                           	``?filter=type.versionNumber:<VALUE-TO-MATCH>``                	All content items where the semantic version component of ``type`` is ``<VALUE-TO-MATCH>``                                            
            ``<MAJOR_VERSION>``                              	``?filter=type.major:<VALUE-TO-MATCH>``                        	All content items where the major version component of ``type`` is ``<VALUE-TO-MATCH>``                                               
            ``<MINOR_VERSION>``                              	``?filter=type.minor:<VALUE-TO-MATCH>``                        	All content items where the minor version component of ``type`` is ``<VALUE-TO-MATCH>``                                               
            ``<PATCH_VERSION>``                              	``?filter=type.patch:<VALUE-TO-MATCH>``                        	All content items where the patch version component of ``type`` is ``<VALUE-TO-MATCH>``                                               
            ``<BUILD_METADATA>``                             	``?filter=type.metadata:<VALUE-TO-MATCH>``                     	All content items where the build metadata component of ``type`` is ``<VALUE-TO-MATCH>``                                              
            =================================================	===============================================================	======================================================================================================================================


            **Note:**

            1. When filtering by string values, the server returns only the content items that exactly match the specified string. It does not return content items with partial matches. Furthermore, matching is case sensitve.
            2. When filtering by a numerical value you can use greater than (>), greater than or equal to (>=), less than (<), and less than or equal to (<=) expressions. The equal condition is specified just like how you would specify an equal condition for a string.
            3. You can combine multiple filter conditions using the logical expressions ``AND``, ``OR``, and ``NOT``  (see Example 2).
          required: false
          schema:
            maxLength: 255
            minLength: 0
            type: string
          example: 'language:enu'
        - name: query
          in: query
          description: |-
            A query expression that defines what content items to retrieve.  This parameter is empty by default, which means all content items that satisfy the filter condition are returned. The maximum length of a query expression is 255 characters.

            =================================================	==============================================================	=======================================================================================
            To query by:                                     	Specify query as:                                             	Retrieves all content items where:                                                     
            =================================================	==============================================================	=======================================================================================
            ``categories.externalId``                        	``?query=categoriesIdAll:<CATEGORY-TO-MATCH>``                	``categories.externalId``  contains ``<CATEGORY-TO-MATCH>`` or one of its descendants. 
            ``categories.externalId``                        	``?query=categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	``categories.externalId``  contains ``<CATEGORY-TO-MATCH>``.                           
            ``categories.id``                                	``?query=categoriesIdAll:<CATEGORY-TO-MATCH>``                	 ``categories.id``  contains ``<CATEGORY-TO-MATCH>`` or one of its descendants.        
            ``categories.id``                                	``?query=categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	``categories.id``  contains ``<CATEGORY-TO-MATCH>``.                                   
            ``components.info.description``                  	``?query=info.description:<VALUE-TO-MATCH>``                  	``components.info.description`` contains  ``<VALUE-TO-MATCH>``.                        
            ``components.info.name``                         	``?query=info.name:<VALUE-TO-MATCH>``                         	``components.info.name`` contains  ``<VALUE-TO-MATCH>``.                               
            Custom attributes under the ``attributes`` object	``?query=attributes.<ATTRIBUTE-NAME>:<VALUE-TO-MATCH>``       	``attributes.<ATTRIBUTE-NAME>`` contains  ``<VALUE-TO-MATCH>``.                        
            Custom attributes under the ``components`` object	``?query=<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>:<VALUE-TO-MATCH>``	``components.<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>`` contains  ``<VALUE-TO-MATCH>``.      
            =================================================	==============================================================	=======================================================================================

            **Note:**

            1. You can combine multiple query expressions using the logical expressions ``AND``, ``OR``, and ``NOT``.
            2. If you don't specify the attribute to query, the server queries both ``info.name`` and ``info.description`` (see Example 5).
          required: false
          schema:
            maxLength: 255
            minLength: 0
            type: string
          example: Reducer
        - name: facets
          in: query
          description: |-
            Specifies what content item attributes to facet the search results on. Specify multiple attributes as a comma-separated list of attributes.

            When specified, the system analyzes your search results and returns the number of content items that have unique values for each attribute you've specified. These unique values and their counts are returned as an object named ``buckets``, in the response.

            For best results, select only attributes that have few unique values. For example, status flags or major classifications.  Facets are returned as specific groups called ``buckets`` in the response. Each bucket contains a count of content items that contain each of the unique values. See Example 1 for an illustration.

            =========================	=======================================	===============================================================================================
            To facet by:             	Specify as:                            	Results in:
            =========================	=======================================	===============================================================================================
            ``categories.externalId``	``?facets=categoriesExternalIdAll``    	Buckets for each unique value of ``categories.externalId`` and the ancestors of that category.
            ``categories.id``        	``?facets=categoriesIdCurrent``        	Buckets for each unique value of ``categories.id``.
            ``categories.id``        	``?facets=categoriesIdAll``            	Buckets for each unique value of ``categories.id`` and the ancestors of that category.
            ``components.tag.values``	``?facets=tag.values``                 	Buckets for each unique value of ``components.tag.values``.
            ``createdBy.serviceId``  	``?facets=creator.userIdValue``        	Buckets for each unique value of ``createdBy.serviceId`` and ``createdBy.userId``.
            ``createdBy.userId``     	``?facets=creator.userIdValue``        	Buckets for each unique value of ``createdBy.serviceId`` and ``createdBy.userId``.
            ``modifiedBy.serviceId`` 	``?facets=lastModifier.userIdValue``   	Buckets for each unique value of ``modifiedBy.serviceId`` and ``modifieddBy.userId``.
            ``modifiedBy.userId``    	``?facets=lastModifier.userIdValue``   	Buckets for each unique value of ``modifiedBy.serviceId`` and ``modifieddBy.userId``.
            ``type``                 	``?facets=type.fullname``              	Buckets for each unique value of ``type``.
            =========================	=======================================	===============================================================================================

            You can also facet by the constituent parts of the ``type`` attribute. If the value of ``type`` is expressed as ``<TYPE_NAME>-<SEMANTIC_VERSION>``, and ``<SEMANTIC_VERSION>`` is expressed as ``<MAJOR_VERSION>.<MINOR_VERSION>.<PATCH_VERSION>-<BUILD_METADATA>``:

            ==================================	=======================================	===============================================================================================
            To facet by:                      	Specify as:                            	Results in:                                                                                    
            ==================================	=======================================	===============================================================================================
            ``<TYPE_NAME>-<SEMANTIC_VERSION>``	``?facets=type.fullname``              	Buckets for each unique value of ``type``.                                                     
            ``<TYPE_NAME>``                   	``?facets=type.name``                  	Buckets for each unique value of ``<TYPE_NAME>``                                               
            ``<SEMANTIC_VERSION>``            	``?facets=type.versionNumber``         	Buckets for each unique value of ``<SEMANTIC_VERSION>``                                        
            ``<MAJOR_VERSION>``               	``?facets=type.major``                 	Buckets for each unique value of ``<MAJOR_VERSION>``                                           
            ``<MINOR_VERSION>``               	``?facets=type.minor``                 	Buckets for each unique value of ``<MINOR_VERSION>``                                           
            ``<PATCH_VERSION>``               	``?facets=type.patch``                 	Buckets for each unique value of ``<PATCH_VERSION>``                                           
            ``<BUILD_METADATA>``              	``?facets=type.metadata``              	Buckets for each unique value of ``<BUILD_METADATA>``                                          
            ==================================	=======================================	===============================================================================================
          required: false
          schema:
            type: string
            items:
              type: string
          examples:
            FacetSearchOnSingleField:
              description: FacetSearchOnSingleField
              value:
                - category
        - name: orderBy
          in: query
          description: |-
            Specifies the content item attributes the search results must be ordered on. The value must be of the form ``A:O``, where ``A`` is the attribute to sort on, and ``O`` is the sort order ( ``asc`` for ascending or ``desc`` for descending).

            If you do not specify this parameter, the order defaults to relevance. The content items that are most relevant to the query criteria are returned first.

            If you do not specify the sort order or specify an invalid sort order, the Content service returns an *Invalid Parameter* error.

            You can specify multiple sort criteria as a comma-separated list of criteria. The Schema service sorts the results by the first criterion in the list, then by the next, and so on. The sort order must be the same across all criteria. For example, if the first criterion is to sort by an attribute in the ascending order, the second criterion can be by a different attribute, but the sort order must be the ascending order.

            =================================================	===============================================
            To order by:                                     	Specify order as:                              
            =================================================	===============================================
            ``components.info.name``                         	``?orderBy=info.name``                         
            ``createdBy.date``                               	``?orderBy=createdBy.date``                    
            ``modifiedBy.date``                              	``?orderBy=modifiedBy.date``                   
            Custom attributes under the ``attributes`` object	``?orderBy=attributes.<ATTRIBUTE-NAME>``       
            Custom attributes under the ``components`` object	``?orderBy=<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>``
            =================================================	===============================================

            You can also order by the constituent parts of the ``type`` attribute. If the value of ``type`` is expressed as ``<TYPE_NAME>-<SEMANTIC_VERSION>``, and ``<SEMANTIC_VERSION>`` is expressed as ``<MAJOR_VERSION>.<MINOR_VERSION>.<PATCH_VERSION>-<BUILD_METADATA>``:

            =================================================	===============================================
            To order by:                                     	Specify order as:                              
            =================================================	===============================================
            ``<TYPE_NAME>-<SEMANTIC_VERSION>``               	``?orderBy=type.fullname``                     
            ``<TYPE_NAME>``                                  	``?orderBy=type.name``                         
            ``<SEMANTIC_VERSION>``                           	``?orderBy=type.versionNumber``                
            ``<MAJOR_VERSION>``                              	``?orderBy=type.major``                        
            ``<MINOR_VERSION>``                              	``?orderBy=type.minor``                        
            ``<PATCH_VERSION>``                              	``?orderBy=type.patch``                        
            ``<BUILD_METADATA>``                             	``?orderBy=type.metadata``                     
            =================================================	===============================================
          required: false
          schema:
            type: string
          examples:
            SortOnSingleField:
              description: SortOnSingleField
              value:
                - 'fieldName:desc'
        - name: offset
          in: query
          description: |
            The number of search results to skip.

            Use this parameter with the ``limit`` query parameter to split search results into multiple pages. To fetch the first page, specify ``offset`` =0 (do not skip any search results). To fetch the second page, specify ``offset`` = value of ``limit`` you specified for the first page. So, the server skips the search results returned on the first page. In general, ``offset`` = ``previous_offset`` + ``previous_limit``.

            This parameter is 0 by default. The minimum value is 0 and the maximum value 9000.
          required: false
          schema:
            maximum: 9000
            minimum: 0
            type: integer
            default: '0'
          example: 0
        - name: limit
          in: query
          description: |
            The maximum number of search results to return in a single page.

            Use this parameter with the ``offset`` query parameter to split search results into multiple pages. To fetch the first page, specify ``offset`` =0 (do not skip any search results). To fetch the second page, specify ``offset`` = value of ``limit`` you specified for the first page. So, the server skips the search results returned on the first page. In general, ``offset`` = ``previous_offset`` + ``previous_limit``.

            This parameter is 50 by default. The minimum value is 10 and the maximum value 50.
          required: false
          schema:
            maximum: 50
            minimum: 10
            type: integer
            default: '50'
          example: 50
        - name: libraryId
          in: query
          description: Specifies the ID of the library to search. Required if the collection does not support search across libraries.
          required: false
          schema:
            type: string
          example: 22d17b7c-dc27-4898-bbe3-c6ac6dbe535a
        - name: language
          in: query
          description: Specifies the MS.NET language code of the query expression to limit the scope of the search to fields containing data in that language. This parameter will be set to "en-US" by default, if empty or absent.
          required: false
          schema:
            type: string
          example: en-US
      responses:
        '200':
          description: The request was successful. A list of content items that satisfy the search criteria you specified was returned with the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemSearchResponse'
              examples:
                SearchContentItemsWithFacet:
                  $ref: '#/components/examples/ResponseSearchContentItemsWithFacet'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
    post:
      tags:
        - Search
      summary: Search for Content Items (POST Method)
      description: |-
        Performs a search on the specified content library and returns a list of content items that satisfy the search criteria. You specify the search criteria using the request body.


        The `GET Search for Content Items </en/docs/content/v2/reference/http/content-searchcontentitemsnew-GET/>`_ operation also performs an identical search. The GET operation uses query string parameters to specify the filter and query statements for the search. So, it is limited by the maximum number of characters that can exist on a URL. Use this operation (POST Search for Content Items) operation if the URL length exceeds 255 characters.

        **Note:** Unlike the GET operation, the response to this operation (POST Search for Content Items) is not cached.
      operationId: searchContentItemsPost
      requestBody:

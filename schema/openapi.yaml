      description: |-
        Creates a collection that is tied to your Autodesk ID (Oxygen ID).

        You can think of a collection as a workspace to contain your content libraries. When you create a collection, the Content service automatically creates a bucket for it in the Object Storage Service (OSS). This bucket is reserved for the binary content of the content libraries within that collection.

        This operation requires an access token obtained through a three-legged OAuth workflow. The collection that is created is tied to the Autodesk ID (Oxygen ID) corresponding to the token. Nevertheless, you can use a two-legged OAuth workflow with impersonation to create a collection.  In such a case, the collection is tied to the Autodesk ID of the user that you are impersonating. You must use the ``x-ads-user-id`` header parameter to specify the Autodesk ID of the user you are impersonating.

        **Note:** Only apps that have their Client IDs on a special *allow list* can impersonate users.

        There can only be one collection per Autodesk ID. So, this operation does not create a collection each time you call it. It creates a collection only if no collection exists for that Autodesk ID. The operation is idempotent. So, even if you call the operation again, it does not return an error. Instead, it kicks off a command that returns the details of the collection previously created for that Autodesk ID.

        See `Collections </en/docs/content/v2/developers_guide/basics/collections>`_ for more information on collections.

        See the tutorial `Set up a Library using Node Workflow </en/docs/content/v2/tutorials/create-content-library/about-this-tutorial>`_ for a demonstration of a workflow that uses this operation.
      parameters:
        - schema:
            type: string
          in: header
          name: x-ads-user-id
          description: |

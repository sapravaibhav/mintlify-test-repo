components:
  schemas:
    CommandResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the command that was checked.
        status:
          type: string
          description: The status of the asynchronous process the command started.
        result:
          $ref: '#/components/schemas/Result'
    CollectionCommandResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the command that was checked.
        status:
          type: string
          description: The status of the asynchronous process the command started.
        result:
          type: object
          description: Details of the results of the asynchronous process started by the command.
          properties:
            id:
              type: string
              description: The ID of the collection that the command created.
    Result:
      type: object
      properties:
        id:
          type: string
          description: 'The ID of the resource that the command created. For example, if the command was to create a library, this attribute contains the ID of the library that was created.'
        url:
          type: string
          description: 'The location of the resource that was created, relative to the Base URL of this endpoint.'
      description: Details of the results of the asynchronous process started by the command.
    Attribute:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: The name of the attribute.
        value:
          maxLength: 512
          minLength: 0
          type: string
          description: Value of the attribute.
        type:
          type: string
          description: |-
            Data type of the attribute. Valid values are ``String``, ``Int32``, ``Int64``, ``Float64``, ``Float32``, or ``Bool``.

            **Note:** This attribute is case-sensitive.
        category:
          type: string
          description: |-
            The category of the attribute.  Possible values are:

            - ``application``: Attributes that can be created and updated by a client application. If you are creating an attribute, you must always set ``category`` to ``application``.
            - ``system``: Attributes that can only be created and updated by the Content service.
      required:
        - name
        - value
        - type
        - category
    AuditEntity:
      type: object
      description: An object added by the server to track creation of and updates to information.
      properties:
        userId:
          type: string
          description: The Autodesk ID of the user responsible for the operation. Available only if the app that was used to perform the operation used a three-legged OAuth token.
        serviceId:
          type: string
          description: The Client ID of the app performing the operation. Available only if the app used a two-legged access token.
        date:
          type: string
          format: date-time
          description: 'The date and time the operation was performed, in UTC format.'
    ContentItem:
      type: object
      description: An object representing a content item.
      properties:
        type:
          type: string
          description: The ID of the schema used for the ``components`` object.
        id:
          type: string
          description: The ID of the content item.
        libraryId:
          type: string
          description: The library ID of the content item.
        attributes:
          description: |-
            An array that contains the definitions of system-generated attributes, custom attributes, and the following predefined attributes:

            - ``etag`` *String*:

              A system generated ID to uniquely identify the version of a content item.

              You typically use this ID with the ``If-Match`` header of a PUT request to prevent simultaneous PUT requests from overwriting each other.

            - ``externalId`` *String*:

              (External ID) An optional ID that you provide, which uniquely identifies a content item.  You can reference and retrieve content items by their External IDs.

              You typically use the External ID to preserve existing IDs when migrating a content library to the Content service.

            - ``exVersion`` *String*:

              (External Version) A user-defined ID that is used to identify a specific version of a content item.

            **Note:** The ``attributes`` object is reserved to hold attributes required by back-end processes. Do not use the ``attributes`` object to hold custom attributes required by user/application workflows. Instead, use the ``components`` object to hold such custom attributes.
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Attribute'
        components:
          $ref: '#/components/schemas/ContentItemComponent'
        categories:
          type: array
          nullable: false
          description: A list of Categories the content item is assigned to.
          items:
            $ref: '#/components/schemas/ContentItemCategory'
        createdBy:
          $ref: '#/components/schemas/AuditEntity'
        modifiedBy:
          $ref: '#/components/schemas/AuditEntity'
    ContentItemWithScore:
      allOf:
        - $ref: '#/components/schemas/ContentItem'
        - type: object
          description: An object representing a content item with score.
          properties:
            score:
              type: number
              description: A numerical value assigned to the content item by the search engine. It indicates the level of relevance the content item has in relation to the search query. A higher score implies a closer match to the search query.
    Response:
      type: object
      description: ''
      properties:
        commandId:
          type: string
          description: |-
            The ID of the command the server issued.

            Use this attribute with `Retrieve Command Info (GET /collections/{collectionId}/commands/{commandId}) </en/docs/content/v2/reference/http/content-getcommandbyid-GET>`_ to check the status of the asynchronous process the command started and the details of any resources it created.
        status:
          type: string
          enum:
            - SUCCESS
          description: Reports the outcome of the request; whether an asynchronous process was started successfully or not.
        createdDate:
          type: string
          description: The date and time (in UTC format) the command was issued.
    ContentItemUpdateRequest:
      type: object
      properties:
        type:
          type: string
          description: |-
            The ID of the schema used for the ``components`` object.

            This ID takes the form ``<TYPE_NAME>-<MAJOR_VERSION>.<MINOR_VERSION>.<PATCH_VERSION>-<BUILD_METADATA>``. You can change only the following:

            - ``<MAJOR_VERSION>``
            - ``<MINOR_VERSION>``
            - ``<PATCH_VERSION>``
            - ``<BUILD_METADATA>``
        attributes:
          type: array
          description: |-
            An array that contains the definitions of system-generated attributes, custom attributes, and the following predefined attribute.

            - ``externalId`` *String*:

              (External ID) An optional ID that you provide at the time a content item is created, which uniquely identifies a content item. You can reference and retrieve content items by their External IDs. You typically use the External ID to preserve existing IDs when migrating a content library to the Content service.

              **Note:** You cannot change the External ID of a content item after the content item has been created.

            - ``exVersion`` *String*:

              (External Version) An optional ID that you provide to identify the version of the content item. This ID must be unique for that content item.

            **Note:**

            - The attribute ``externalId`` and attributes of the type ``system`` are ignored in the update request.

            - The ``attributes`` object is reserved to hold attributes required by back-end processes. Do not use the ``attributes`` object to hold custom attributes required by user/application workflows. Instead, use the ``components`` object to hold such custom attributes.
          items:
            $ref: '#/components/schemas/Attribute'
        libraryId:
          type: string
          description: The ID of the library containing the content item. This system ignores the value you specify for this attribute.
        components:
          $ref: '#/components/schemas/ContentItemCreateComponent'
    ContentItemCreateRequest:
      type: object
      description: ''
      properties:
        type:
          type: string
          description: |-
            The ID of the schema used for the components object. Must be ``autodesk.fcs:asset.contentItem-1.0.0`` or the ID of a schema that contains all the required attributes of ``autodesk.fcs:asset.contentItem-1.0.0`` + custom attributes.

            The only validation that the system performs on ``type`` is that it must follow the pattern ``ABC-xxx.yyy.zzz``, where ``ABC`` is the type name, and ``xxx.yyy.zzz`` is the semantic version of the type. The type name must not exceed 128 characters. The semantic version must not exceed 32 characters. You can specify pre-release and build metadata as extensions to the ``xxx.yyy.zzz`` format. The maximum supported version number is ``999.999.999``.

            For example, for the default type ``autodesk.fcs:asset.contentItem-1.0.0``, ``autodesk.fcs:asset.contentItem-1.0.0`` is the type name, and ``1.0.0`` is the semantic version.
        attributes:
          type: array
          description: |-
            An array that contains the definitions of system-generated attributes, custom attributes, and the following predefined attributes:

            - ``externalId`` *String*:

              (External ID) An optional ID that you provide, which uniquely identifies a content item. You can reference and retrieve content items by their External IDs.

              You typically use the External ID to preserve existing IDs when migrating a content library to the Content service.

              ``externalId`` can only contain alphanumeric characters and the hyphen (-) character. Typically, a UUID or a string with a minimum length of 6 characters and a maximum length of 36 characters.

              A node and a content item cannot have the same External ID. ``externalId`` must be unique across nodes and content items.

            - ``exVersion`` *String*:

              (External Version) An optional ID that you provide to identify the version of the content item. This ID must be unique for that content item.

              **Note:** The Content service maintains its own ID for the version regardless of whether you specify an External ID or not. This ID is called the *Internal Version* of the content item. The External Version serves as an alias for the Internal Version. Currently, the Internal Version is not exposed via any API.


            **Note:** The ``attributes`` object is reserved to hold attributes required by back-end processes. Do not use the ``attributes`` object to hold custom attributes required by user/application workflows. Instead, use the ``components`` object to hold such custom attributes.
          items:
            $ref: '#/components/schemas/Attribute'
        components:
          $ref: '#/components/schemas/ContentItemCreateComponent'
        categories:
          type: array
          nullable: true
          description: |-
            The list of Categories to assign the content item to.

            **Note:** You cannot specify the same Category object more than once.
          items:
            $ref: '#/components/schemas/AssignCategory2ContentItem'
    File:
      type: object
      description: An object containing information about a file referenced by a content item. Typically this file is a raw binary content file or a thumbnail image file.
      properties:
        name:
          type: string
          description: The file name of the referenced file. Maximum length is 200 characters.
        description:
          type: string
          description: A short description of the referenced file. Maximum length is 200 characters.
        mimeType:
          type: string
          description: The content type of the referenced file. Maximum length is 200 characters.
        objectKey:
          type: string
          description: |-
            The ``objectKey`` (Object Key) attribute that was returned in the response body when the file was uploaded to OSS. Maximum length is 1024 characters.

            **Note:** The Content service can only support Object Keys made up of the following characters:

            - alphabetic characters A through Z and a through z.
            - numeric characters 0 through 9.
            - special characters hyphen (-), underscore (_), and period (.).

            If you do not restrict yourself to the supported characters, the Content service throws an error when you try to access the binary content.
        checksum:
          type: string
          description: |-
            The checksum of the file. Use your own checksum generator to obtain the checksum before you upload the file to OSS. Length must be 40 characters.

            **Note:** The server only performs a syntax and limits validation on ``checksum``. It does not check if the value you specified is correct.
        size:
          type: integer
          description: |-
            The file size of the referenced file, in bytes.

            **Note:** The server only performs a syntax and limits validation. It does not check if the value you specified is correct. So, even if the size you specify is different from the size of the file in OSS, the server accepts your input as valid.
      required:
        - name
        - description
        - mimeType
        - objectKey
        - size
    FileResponse:
      type: object
      description: An object containing references to the file with the content corresponding to the content item.
      properties:
        name:
          type: string
          description: The file name of the referenced file.
        description:
          type: string
          description: A short description of the referenced file.
        mimeType:
          type: string
          description: The content type of the referenced file.
        objectKey:
          type: string
          description: The key that uniquely identifies the file in the OSS bucket that it is saved to.
        checksum:
          type: string
          description: The checksum of the file that was specified when the file was uploaded to OSS.
        size:
          type: integer
          description: 'The file size of the referenced file, in bytes.'
        fileUrl:
          type: string
          description: The URL of the file.
    Thumbnail:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          description: An object containing information about an image file used as a thumbnail of the content item.
          properties:
            width:
              type: integer
              description: 'The width of the thumbnail, in pixels. Minimum value is 1.'
            height:
              type: integer
              description: 'The height of the thumbnail, in pixels. Minimum value is 1.'
          required:
            - width
            - height
      description: An object containing information about the image file to be used as the thumbnail for the content item.
    ThumbnailResponse:
      allOf:
        - $ref: '#/components/schemas/FileResponse'
        - type: object
          description: An object containing information about an image file used as a thumbnail of the content item.
          properties:
            width:
              type: integer
              description: 'The width of the thumbnail, in pixels.'
            height:
              type: integer
              description: 'The height of the thumbnail, in pixels.'
      description: An object containing information about the image file to be used as the thumbnail for the content item.
    ContentItemComponent:
      type: object
      description: A JSON object containing the metadata components of the content item. The structure of this object follows the schema specified by the ``type`` attribute.
      properties:
        info:
          type: object
          description: An object containing the basic information about the content item.
          properties:
            name:
              type: string
              description: The name of the content item.
            description:
              type: string
              description: A short description of the content item.
          required:
            - name
        parent:
          type: object
          description: Specifies the node the content item is placed under. Contains the ``id`` or the ``externalId`` of the parent, but not both.
          properties:
            id:
              type: string
              description: The ID of the parent node.
            externalId:
              type: string
              description: The External ID of the parent node.
        locale:
          type: object
          description: Specifies the locale (area/territory) that the content applies to.
          properties:
            language:
              type: string
              description: The ISO 639 language code of the locale.
            country:
              type: string
              description: The ISO 3166 country code indicating the variant of the language of the locale.
        status:
          type: object
          description: An object containing information about the current state of the content item.
          properties:
            value:
              type: string
              description: 'Current state of the content item. Possible values are ``draft``, ``published``.'
        tag:
          type: object
          nullable: true
          description: An object containing keywords associated with the content item.
          properties:
            values:
              type: array
              description: |
                A collection of keywords associated with the content item.

                You can use these keywords to query, filter, and facet content items when you use `GET Search for Content Items </en/docs/content/v2/reference/http/content-searchcontentitemsnew-GET/>`_.
              items:
                type: string
        files:
          type: array
          nullable: true
          description: An array containing information about the raw binary content files referenced by the content item.
          items:
            $ref: '#/components/schemas/FileResponse'
        thumbnails:
          type: array
          nullable: true
          description: An array containing information about the image files referenced by the content item. These image files are used as thumbnails of the content.
          items:
            $ref: '#/components/schemas/ThumbnailResponse'
      additionalProperties:
        type: object
        description: |
          A JSON object that acts as a container for custom attributes. The name and structure of this object must conform to the schema you specified for the ``type`` attribute.

          **Note:** The ``attributes`` object can also hold custom attributes. Use the ``attributes`` object to hold custom attributes required by back-end processes. Use the ``components`` object to hold custom attributes required by application workflows.
    ContentItemCreateComponent:
      type: object
      description: A JSON object containing the metadata components of the content item. The structure of this object follows the schema you specified for the ``type`` attribute.
      additionalProperties:
        type: object
        description: |
          A JSON object that acts as a container for custom attributes. The name and structure of this object must match the name and structure defined by the schema you specified for the ``type`` attribute.

          **Note:** The ``attributes`` object can also hold custom attributes. Use the ``attributes`` to hold custom attributes required by back-end processes. Use the ``components`` object to hold custom attributes required by application workflows.
      properties:
        info:
          type: object
          description: An object containing the basic information about the content item.
          required:
            - name
          properties:
            name:
              type: string
              description: The name of the content item. Maximum length is 256 characters. Minimum length is 3 characters.
            description:
              type: string
              description: A short description of the content item. Maximum length is 256 characters. Minimum length is 1 character.
        parent:
          type: object
          description: Specifies the node under which the content item must be created. Specify the ``id`` or the ``externalId`` of the parent, but not both.
          properties:
            id:
              type: string
              description: The ID of the parent node or library. Do not specify an ID if you have already specified an External ID (``externalId``).
            externalId:
              type: string
              description: The External ID of the parent node or library. Do not specify an External ID if you have already specified an ID (``id``).
        locale:
          type: object
          description: Specifies the locale (area/territory) that the content applies to. See the Supported Locales section in `Schema </en/docs/content/v2/developers_guide/basics/schema>`_ for a list of valid values you can specify.
          properties:
            language:
              type: string
              description: The ISO 639 language code of the locale. The default is ``en`` for English.
            country:
              type: string
              description: The ISO 3166 country code indicating the variant of the language of the locale. The default is ``US``.
        status:
          type: object
          description: An object containing information about the current state of the content item.
          properties:
            value:
              type: string
              description: |-
                Current state of the content item. Possible values are ``draft``, ``published``.

                **Note:** Once you specify a value for ``status``, the system does not let you change it.
        tag:
          type: object
          description: An object containing keywords to associate with the content item.
          nullable: true
          properties:
            values:
              type: array
              description: |-
                A collection of keywords to tag the content item with.

                You can use these keywords to query, filter, and facet content items when you use `GET Search for Content Items </en/docs/content/v2/reference/http/content-searchcontentitemsnew-GET/>`_.
              items:
                type: string
        files:
          type: array
          description: |-
            An array containing information about the raw binary content files referenced by the content item.

            **Note:**

            1. Because ``files`` is an optional attribute, the server considers ``NULL`` and empty arrays to be valid inputs.
            2. The server does not validate the content of the array. It only performs syntax validation. So, even if you specify duplicate object keys, the server accepts the input as valid.
            3. The maximum number of files that can be specified is 5.
          items:
            $ref: '#/components/schemas/File'
        thumbnails:
          type: array
          description: |-
            An array containing information about the image files referenced by the content item. These image files are used as thumbnails of the content.

            **Note:**

            1. Because ``thumbnails`` is an optional attribute, the server considers ``NULL`` and empty arrays to be valid inputs.
            2. The server does not validate the content of the array. It only performs syntax validation. So, even if you specify duplicate object keys, the server accepts the input as valid.
            3. The maximum number of thumbnails that can be specified is 5.
          items:
            $ref: '#/components/schemas/Thumbnail'
      required:
        - info
    ContentItemCategory:
      type: object
      properties:
        id:
          type: string
          description: The ID of the Category the content item is assigned to.
        collectionId:
          type: string
          description: The ID of the collection that contains the Category.
        libraryId:
          type: string
          description: The ID of the library that contains the Category.
    ContentError:
      type: object
      properties:
        id:
          type: string
          description: The ID of the content item the Content service was accessing when the error occurred.
        message:
          type: string
          description: A brief explanation of what went wrong.
    ContentItemSearchResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: 'An array of objects, where each element of the array is a content item.'
          items:
            $ref: '#/components/schemas/ContentItemWithScore'
        errors:
          type: array
          description: An array of objects where each element represents an error that was encountered during the search.
          items:
            $ref: '#/components/schemas/ContentError'
        facets:
          type: object
          description: Object containing the unique values the returned content items were faceted on.
          additionalProperties:
            $ref: '#/components/schemas/Facet'
    Facet:
      type: object
      description: The attribute the search results are faceted on.
      properties:
        buckets:
          type: array
          description: A container of facets.
          items:
            $ref: '#/components/schemas/FacetBucket'
    FacetBucket:
      type: object
      properties:
        key:
          type: string
          description: A unique value of the attribute the search results are faceted on.
        count:
          type: integer
          format: int32
          description: A count of the content items that contain the value.
    UrlPagination:
      type: object
      description: 'Pagination information to fetch the next page, when the results span multiple pages.'
      properties:
        limit:
          type: integer
          format: int32
          description: The maximum number of items you requested for this page.
        offset:
          type: integer
          format: int32
          description: The number of items skipped (because they were returned in previous pages) when returning this page.
        totalResults:
          type: integer
          format: int32
          description: Total number of items to be returned.
        nextUrl:
          type: string
          nullable: true
          description: 'The link to the next page. If the current page is the last page, the server does not return this attribute.'
        previousUrl:
          type: string
          nullable: true
          description: 'The link to the previous page. If the current page is the first page, the server does not return this attribute.'
    Library:
      type: object
      properties:
        type:
          type: string
          description: The ID of the schema used for the ``components`` object.
        id:
          type: string
          description: The ID of the library.
        attributes:
          type: array
          description: |-
            An array that contains the definitions of system-generated attributes, custom attributes, and the following predefined attributes:

            - ``etag``: A system generated ID to uniquely identify the version of a library. You typically use this ID with the ``If-Match`` header of a PUT request to prevent simultaneous PUT requests from overwriting each other.
            - ``oss-urn``: A system-generated attribute that contains the URN of the bucket to store the binary content of the library. This attribute is automatically created when you create a library. The bucket is deleted when you delete the library.
            - ``visibility``: (Visibility) Indicates whether the library is ``public`` or ``private``. If this attribute is not specified, the library is considered private.

              Public libraries can be accessed by any user or app with a valid access token. Private libraries can only be accessed by their owner or users and apps that have permission.

            **Note:** The ``attributes`` object is reserved to hold attributes required by back-end processes. Do not use the ``attributes`` object to hold custom attributes required by user/application workflows. Instead, use the ``components`` object to hold such custom attributes.
          items:
            $ref: '#/components/schemas/Attribute'
        components:
          $ref: '#/components/schemas/LibraryComponent'
        createdBy:
          $ref: '#/components/schemas/AuditEntity'
        modifiedBy:
          $ref: '#/components/schemas/AuditEntity'
    LibraryList:
      type: object
      properties:
        results:
          type: array
          description: An array of nodes.
          items:
            $ref: '#/components/schemas/Library'
    NodeList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: An array of nodes.
          items:
            $ref: '#/components/schemas/Node'
        errors:
          type: array
          description: |-
            An array of objects, where each object represents an error that occurred while fetching a node.

            If the Content service encounters an error while fetching a node, it appends an error to this array. Thereafter it moves on to fetch the next node.
          items:
            $ref: '#/components/schemas/Error'
    NodeAndContentItemList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: An array of objects containing content items or nodes.
          items:
            oneOf:
              - $ref: '#/components/schemas/Node'
              - $ref: '#/components/schemas/ContentItem'
        errors:
          description: 'An array of objects containing any errors that may have occurred while fetching children. '
          type: array
          items:
            $ref: '#/components/schemas/Error'
    AssignmentList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: An array of objects representing assigned content items.
          items:
            $ref: '#/components/schemas/ContentItem'
        errors:
          type: array
          description: |-
            An array of objects containing any errors that may have occurred while fetching children.

            If the Content service threw an error while fetching a child, it appends the error to this array. Thereafter, it moves on to fetch the next child.
          items:
            $ref: '#/components/schemas/Error'
    TagList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: 'An array of Tag objects, which are the children of the Tag specified by the ``categoryId`` URI parameter.'
          items:
            $ref: '#/components/schemas/Tag'
        errors:
          type: array
          description: |-
            An array of objects containing any errors that may have occurred while fetching children.

            If the Content service threw an error while fetching a child, it appends the error to this array. Thereafter, it moves on to fetch the next child.
          items:
            $ref: '#/components/schemas/Error'
    FolderList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: 'An array of Category objects, which are the children of the Category specified by the ``categoryId`` URI parameter.'
          items:
            $ref: '#/components/schemas/Folder'
        errors:
          type: array
          description: |-
            An array of objects containing any errors that may have occurred while fetching children.

            If the Content service threw an error while fetching a child, it appends the error to this array. Thereafter, it moves on to fetch the next child.
          items:
            $ref: '#/components/schemas/Error'
    CategoryList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: 'An array of Category objects, which are the children of the Category specified by the ``categoryId`` URI parameter.'
          items:
            $ref: '#/components/schemas/Category'
        errors:
          type: array
          description: |-
            An array of objects containing any errors that may have occurred while fetching children.

            If the Content service threw an error while fetching a child, it appends the error to this array. Thereafter, it moves on to fetch the next child.
          items:
            $ref: '#/components/schemas/Error'
    AssetList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UrlPagination'
        results:
          type: array
          description: An array of asset object.
          items:
            $ref: '#/components/schemas/BaseAsset'
        errors:
          type: array
          description: |-
            An array of objects containing any errors that may have occurred while fetching children.

            If the Content service threw an error while fetching a child, it appends the error to this array. Thereafter, it moves on to fetch the next child.
          items:
            $ref: '#/components/schemas/Error'
    BaseAsset:
      type: object
      properties:
        id:
          type: string
          description: The ID that uniquely identifies the asset.
        type:
          type: string
          description: The ID of the schema used for the ``components`` object.
        components:
          $ref: '#/components/schemas/Component'
        attributes:
          $ref: '#/components/schemas/AttributeList'
          nullable: true
        createdBy:
          $ref: '#/components/schemas/AuditEntity'
        modifiedBy:
          $ref: '#/components/schemas/AuditEntity'
    Component:
      type: object
      description: A JSON object containing the metadata components. The structure of this object follows the schema specified by the ``type`` attribute.
      additionalProperties:
        type: object
        description: A JSON object that acts as a container for user-defined attributes. The name and structure of this object is defined by the schema specified by the ``type`` attribute.
    AttributeList:
      type: array
      description: An array of attribute object.
      items:
        $ref: '#/components/schemas/Attribute'
    LibraryUpdateRequest:
      type: object
      properties:
        type:
          type: string
          description: |-
            The ID of the schema that defines the structure of the ``components`` object request body.

            **Note:** You cannot use this request to change the ``type`` attribute. Update Library requests can only change the attributes of the ``components`` object and the ``attributes`` object.
        attributes:
          type: array
          description: |-
            An array of custom attributes to associate with the library, and the following predefined attributes:

            - ``visibility``: Specifies if the library is public or private. Possible values are ``public`` or ``private``. If this attribute is not available, the library is considered private.

              Public libraries can be accessed by any user or app with a valid access token. Private libraries can only be accessed by their owner or users and apps that have permission.
            - Attributes of the type ``system`` will be ignored in the update request.


            **Note:** The ``attributes`` object is reserved to hold attributes required by back-end processes. Do not use the ``attributes`` object to hold custom attributes required by user/application workflows. Instead, use the ``components`` object to hold such custom attributes.
          items:
            $ref: '#/components/schemas/Attribute'
        components:
          $ref: '#/components/schemas/LibraryCreateComponent'
      required:
        - components
    LibraryCreateRequest:
      type: object
      title: ''
      description: ''
      properties:
        type:
          type: string
          description: |-

    SearchCriteria:
      allOf:
        - $ref: '#/components/schemas/CommonCriteria4SearchAndFacets'
        - $ref: '#/components/schemas/SearchOnlyCriteria'
    CommonCriteria4SearchAndFacets:
      type: object
      properties:
        filter:
          type: string
          description: |-
            A filter expression to limit the scope of the search to content items that exactly match the specified criteria. This parameter is empty by default, which means that the scope of the search is all content items.  Specifying filters result in faster searches.

            =================================================	=======================================================	======================================================================================================================================
            To filter by:                                    	Specify filter as:                                      Result:                                                                                                                               
            =================================================	=======================================================	======================================================================================================================================
            ``attributes.etag``                              	``attributes.etag:<VALUE-TO-MATCH>``                   	Content item where ``attributes.etag`` is ``<VALUE-TO-MATCH>``                                                                        
            ``categories.externalId``                        	``categoriesIdAll:<CATEGORY-TO-MATCH>``                	All content items where ``categories.externalId``  is ``<CATEGORY-TO-MATCH>`` or one of its descendants.                              
            ``categories.externalId``                        	``categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	All content items where ``categories.externalId``  is ``<CATEGORY-TO-MATCH>``.                                                        
            ``categories.id``                                	``categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	All content items where ``categories.id``  is ``<CATEGORY-TO-MATCH>``.                                                                
            ``components.status.value``                      	``status:<VALUE-TO-MATCH>``                            	All content items where ``components.status.value``  is ``<VALUE-TO-MATCH>``                                                          
            ``components.tag.values``                        	``tag.values:<VALUE-TO-MATCH>``                        	All content items where ``components.tag.value``  is ``<VALUE-TO-MATCH>``. See examples 2 and 3 for an illustration.                  
            ``createdBy.date``                               	``createTime>=<TIME-STAMP-TO-MATCH>``                  	All content items where ``createdBy.date`` is greater than or equal to ``<TIME-STAMP-TO-MATCH>``.                                     
            ``createdBy.serviceId``                          	``createdBy:<VALUE-TO-MATCH>``                         	All content items where ``createdBy.serviceId```  is ``<VALUE-TO-MATCH>``. See example 3 for an illustration.                         
            ``id``                                           	``id:<VALUE-TO-MATCH>``                                	Content item where ``id`` is ``<VALUE-TO-MATCH>``                                                                                     
            ``modifiedBy.date``                              	``lastModifiedTime>=<TIME-STAMP-TO-MATCH>``            	All content items where ``modifiedBy.date`` is greater than or equal to ``<TIME-STAMP-TO-MATCH>``.                                    
            ``modifiedBy.serviceId``                         	``lastModifiedBy:<VALUE-TO-MATCH>``                    	All content items where ``modifiedBy.serviceId`` is ``<VALUE-TO-MATCH>``.                                                             
            ``type``                                         	``type.fullname:<VALUE-TO-MATCH>``                     	All content items where ``type`` is ``<VALUE-TO-MATCH>``                                                                              
            Custom attributes under the ``attributes`` object	``attributes.<CUSTOM-ATTRIBUTE>:<VALUE-TO-MATCH>``     	All content items where ``attributes.<CUSTOM-ATTRIBUTE>`` is ``<VALUE-TO-MATCH>``                                                     
            Custom attributes under the ``components`` object	``<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>:<VALUE-TO-MATCH>``	All content items where ``components.<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>``  is ``<VALUE-TO-MATCH>``. See example 3 for an illustration.
            =================================================	=======================================================	======================================================================================================================================

            You can filter by the constituent parts of the ``type`` attribute. If the value of ``type`` is expressed as ``<TYPE_NAME>-<SEMANTIC_VERSION>``, and ``<SEMANTIC_VERSION>`` is expressed as ``<MAJOR_VERSION>.<MINOR_VERSION>.<PATCH_VERSION>-<BUILD_METADATA>``:

            =================================================	=======================================================	======================================================================================================================================
            To filter by:                                    	Specify filter as:                                             	Result:                                                                                                                               
            =================================================	=======================================================	======================================================================================================================================
            ``<TYPE_NAME>-<SEMANTIC_VERSION>``               	``type.fullname:<VALUE-TO-MATCH>``                     	All content items where ``type`` is ``<VALUE-TO-MATCH>``                                                                              
            ``<TYPE_NAME>``                                  	``type.name:<VALUE-TO-MATCH>``                         	All content items where the type name component of ``type`` is ``<VALUE-TO-MATCH>``                                                   
            ``<SEMANTIC_VERSION>``                           	``type.versionNumber:<VALUE-TO-MATCH>``                	All content items where the semantic version component of ``type`` is ``<VALUE-TO-MATCH>``                                            
            ``<MAJOR_VERSION>``                              	``type.major:<VALUE-TO-MATCH>``                        	All content items where the major version component of ``type`` is ``<VALUE-TO-MATCH>``                                               
            ``<MINOR_VERSION>``                              	``type.minor:<VALUE-TO-MATCH>``                        	All content items where the minor version component of ``type`` is ``<VALUE-TO-MATCH>``                                               
            ``<PATCH_VERSION>``                              	``type.patch:<VALUE-TO-MATCH>``                        	All content items where the patch version component of ``type`` is ``<VALUE-TO-MATCH>``                                               
            ``<BUILD_METADATA>``                             	``type.metadata:<VALUE-TO-MATCH>``                     	All content items where the build metadata component of ``type`` is ``<VALUE-TO-MATCH>``                                              
            =================================================	=======================================================	======================================================================================================================================
            
            **Note:**
            
            1. When filtering by string values, the server returns only the content items that exactly match the specified string. It does not return content items with partial matches. Furthermore, matching is case sensitve.
            2. When filtering by a numerical value you can use greater than (>), greater than or equal to (>=), less than (<), and less than or equal to (<=) expressions. The equal condition is specified just like how you would specify an equal condition for a string.
            3. You can combine multiple filter conditions using the logical expressions ``AND``, ``OR``, and ``NOT``.
        query:
          type: string
          description: |-
            A query expression that defines what content items to retrieve.  This parameter is empty by default, which means all content items that satisfy the filter condition are returned.

            =================================================	=======================================================	=======================================================================================
            To query by:                                     	Specify query as:                                       Retrieves all content items where:                                                     
            =================================================	=======================================================	=======================================================================================
            ``categories.externalId``                        	``categoriesIdAll:<CATEGORY-TO-MATCH>``                	``categories.externalId``  contains ``<CATEGORY-TO-MATCH>`` or one of its descendants. 
            ``categories.externalId``                        	``categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	``categories.externalId``  contains ``<CATEGORY-TO-MATCH>``.                           
            ``categories.id``                                	``categoriesIdAll:<CATEGORY-TO-MATCH>``                	 ``categories.id``  contains ``<CATEGORY-TO-MATCH>`` or one of its descendants.        
            ``categories.id``                                	``categoriesIdCurrent:<CATEGORY-TO-MATCH>``            	``categories.id``  contains ``<CATEGORY-TO-MATCH>``.                                   
            ``components.info.description``                  	``info.description:<VALUE-TO-MATCH>``                  	``components.info.description`` contains  ``<VALUE-TO-MATCH>``.                        
            ``components.info.name``                         	``info.name:<VALUE-TO-MATCH>``                         	``components.info.name`` contains  ``<VALUE-TO-MATCH>``.                               
            Custom attributes under the ``attributes`` object	``attributes.<ATTRIBUTE-NAME>:<VALUE-TO-MATCH>``       	``attributes.<ATTRIBUTE-NAME>`` contains  ``<VALUE-TO-MATCH>``.                        
            Custom attributes under the ``components`` object	``<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>:<VALUE-TO-MATCH>``	``components.<CUSTOM-OBJECT>.<CUSTOM-ATTRIBUTE>`` contains  ``<VALUE-TO-MATCH>``.      
            =================================================	=======================================================	=======================================================================================

            **Note:**

            1. You can combine multiple query expressions using the logical expressions ``AND``, ``OR``, and ``NOT``.
            2. If you don't specify the attribute to query, the server queries both ``info.name`` and ``info.description`` (see Example 5).
        facets:
          type: array
          description: |-
            Specifies what content item attributes to facet the search results on. Specify multiple attributes as a comma-separated list of attributes.

            When specified, the system analyzes your search results and returns the number of content items that have unique values for each attribute you’ve specified. These unique values and their counts are returned as an object named ``buckets``, in the response.

            For best results, select only attributes that have few unique values. For example, status flags or major classifications.  The search results include a count of content items that contain each of the unique values. See Example 1 for an illustration.

            =================================	===============================	===============================================================================================
            To facet by:                     	Specify as:                     Results in:
            =================================	===============================	===============================================================================================
            ``categories.externalId``        	``categoriesExternalIdAll``    	Buckets for each unique value of ``categories.externalId`` and the ancestors of that category.
            ``categories.id``                	``categoriesIdCurrent``        	Buckets for each unique value of ``categories.id``.
            ``categories.id``                	``categoriesIdAll``            	Buckets for each unique value of ``categories.id`` and the ancestors of that category.
            ``components.tag.values``        	``tag.values``                 	Buckets for each unique value of ``components.tag.values``.
            ``createdBy.serviceId``          	``creator.userIdValue``        	Buckets for each unique value of ``createdBy.serviceId`` and ``createdBy.userId``.
            ``createdBy.userId``             	``creator.userIdValue``        	Buckets for each unique value of ``createdBy.serviceId`` and ``createdBy.userId``.
            ``modifiedBy.serviceId``         	``lastModifier.userIdValue``   	Buckets for each unique value of ``modifiedBy.serviceId`` and ``modifieddBy.userId``.
            ``modifiedBy.userId``            	``lastModifier.userIdValue``   	Buckets for each unique value of ``modifiedBy.serviceId`` and ``modifieddBy.userId``.
            ``type``                         	``type.fullname``              	Buckets for each unique value of ``type``.
            =================================	===============================	===============================================================================================


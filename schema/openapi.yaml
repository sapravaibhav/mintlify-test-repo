        A distribution library is a library that contains content items that have been assigned to it from another library. The content item continues to belong to the original library, but is shared with the distribution library. The content item becomes visible and accessible in the distribution library.

        The server verifies whether the calling user or service has the necessary permissions to create libraries within the specified collection. If authorized, the server initiates a command that triggers an asynchronous process to clone the library.
